// Jaci: um computador kOS em toda peça de comando (cápsulas e sondas) que
// ainda não tem, já com o boot da ponte do Jaci. Dá para trocar o boot no
// menu da peça no VAB. Para desfazer, apague a pasta GameData/JaciKOS.
@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[kOSProcessor]]:NEEDS[kOS]:FINAL
{
    MODULE
    {
        name = kOSProcessor
        diskSpace = 20000
        ECPerBytePerSecond = 0
        ECPerInstruction = 0.000004
        bootFile = /boot/jaci.ks
    }
}
